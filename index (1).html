<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f7f7f7;
            color: #333;
        }
        header {
            background: #4285f4;
            color: white;
            padding: 20px;
            border-radius: 8px;
        }
        main {
            margin-top: 20px;
        }
        footer {
            margin-top: 30px;
            color: #777;
            font-size: 0.9em;
        }
        .card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 8px rgba(0,0,0,0.06);
            max-width: 500px;
            margin: 0 auto;
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Web Page</h1>
    </header>
    <main>
        <div class="card">
            <h2>About</h2>
            <p>This is a simple web page example using HTML and a bit of CSS. You can use this as a template for your own site or project.</p>
            <ul>
                <li>Easy to customize</li>
                <li>Responsive layout</li>
                <li>Modern look</li>
            </ul>
        </div>
    </main>
    <footer>
        &copy; 2025 Your Name. All rights reserved.
    </footer>
</body>
</html>
